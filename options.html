<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Favicon Changer — Options</title>
<style>
  :root {
    --bg: #1a1a2e;
    --bg2: #16213e;
    --bg3: #0f3460;
    --accent: #e94560;
    --accent2: #ff6b6b;
    --text: #eaeaea;
    --text2: #a0a0b8;
    --border: #2a2a4a;
    --radius: 8px;
    --success: #53d769;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    min-height: 100vh;
  }
  .container {
    max-width: 700px;
    margin: 0 auto;
    padding: 40px 24px;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .subtitle {
    color: var(--text2);
    font-size: 13px;
    margin-bottom: 30px;
  }
  .section {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  .section h2 {
    font-size: 15px;
    margin-bottom: 14px;
    color: var(--accent);
  }
  .stat-row {
    display: flex;
    gap: 20px;
    margin-bottom: 16px;
  }
  .stat {
    flex: 1;
    background: var(--bg);
    border-radius: var(--radius);
    padding: 14px;
    text-align: center;
  }
  .stat .num {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
  }
  .stat .label {
    font-size: 11px;
    color: var(--text2);
    margin-top: 4px;
  }
  .rules-table {
    width: 100%;
    border-collapse: collapse;
  }
  .rules-table th {
    text-align: left;
    padding: 8px 10px;
    font-size: 11px;
    color: var(--text2);
    border-bottom: 1px solid var(--border);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .rules-table td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    vertical-align: middle;
  }
  .rules-table tr:hover td { background: rgba(255,255,255,.02); }
  .rules-table img {
    width: 24px; height: 24px;
    border-radius: 4px;
    vertical-align: middle;
  }
  .type-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--bg3);
    color: var(--text2);
  }
  .del-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text2);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 11px;
  }
  .del-btn:hover { border-color: var(--accent); color: var(--accent); }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 9px 18px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
    transition: all .2s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { border-color: var(--accent); color: var(--accent); }
  .btn-danger:hover { background: var(--accent); color: #fff; }
  .empty {
    text-align: center;
    padding: 30px;
    color: var(--text2);
    font-size: 13px;
  }
  .version-footer {
    text-align: center;
    padding: 30px 0;
    color: var(--text2);
    font-size: 11px;
  }
  input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e94560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <circle cx="12" cy="12" r="4"/>
      <path d="M3 12h4M17 12h4M12 3v4M12 17v4"/>
    </svg>
    Favicon Changer — Options
  </h1>
  <div class="subtitle">Gérez toutes vos règles de favicon personnalisées</div>

  <div class="section">
    <h2>Statistiques</h2>
    <div class="stat-row">
      <div class="stat"><div class="num" id="totalRules">0</div><div class="label">Règles</div></div>
      <div class="stat"><div class="num" id="pageRules">0</div><div class="label">Pages</div></div>
      <div class="stat"><div class="num" id="domainRules">0</div><div class="label">Domaines</div></div>
      <div class="stat"><div class="num" id="bookmarkRules">0</div><div class="label">Favoris</div></div>
    </div>
  </div>

  <div class="section">
    <h2>Toutes les règles</h2>
    <table class="rules-table" id="rulesTable">
      <thead>
        <tr>
          <th>Icône</th>
          <th>Cible</th>
          <th>Type</th>
          <th>Date</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rulesBody"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none">Aucune règle définie</div>
    <div class="actions">
      <button class="btn" id="exportBtn">Exporter (JSON)</button>
      <button class="btn" id="importBtn">Importer (JSON)</button>
      <input type="file" id="importFile" accept=".json">
      <button class="btn btn-danger" id="deleteAllBtn">Tout supprimer</button>
    </div>
  </div>

  <div class="version-footer">Favicon Changer v1.0.0</div>
</div>

<script>
async function load() {
  const resp = await chrome.runtime.sendMessage({ action: "getRules" });
  const rules = resp.rules || {};
  const keys = Object.keys(rules);

  let pages = 0, domains = 0, bookmarks = 0;
  keys.forEach(k => {
    const r = rules[k];
    if (r.type === "domain") domains++;
    else if (r.type === "bookmark") bookmarks++;
    else pages++;
  });

  document.getElementById("totalRules").textContent = keys.length;
  document.getElementById("pageRules").textContent = pages;
  document.getElementById("domainRules").textContent = domains;
  document.getElementById("bookmarkRules").textContent = bookmarks;

  const tbody = document.getElementById("rulesBody");
  tbody.innerHTML = "";

  if (!keys.length) {
    document.getElementById("emptyMsg").style.display = "";
    document.getElementById("rulesTable").style.display = "none";
    return;
  }
  document.getElementById("emptyMsg").style.display = "none";
  document.getElementById("rulesTable").style.display = "";

  for (const key of keys) {
    const r = rules[key];
    const tr = document.createElement("tr");
    const date = r.createdAt ? new Date(r.createdAt).toLocaleDateString("fr-FR") : "—";
    const typeLabel = r.type === "domain" ? "Domaine" :
                      r.type === "bookmark" ? "Favori" : "Page";
    const label = r.label || key;
    const short = label.length > 50 ? label.slice(0, 50) + "…" : label;
    tr.innerHTML = `
      <td><img src="${r.faviconDataUrl}" alt=""></td>
      <td title="${label}">${short}</td>
      <td><span class="type-badge">${typeLabel}</span></td>
      <td>${date}</td>
      <td><button class="del-btn" data-key="${key}">Supprimer</button></td>
    `;
    tbody.appendChild(tr);
  }

  tbody.querySelectorAll(".del-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      await chrome.runtime.sendMessage({ action: "deleteRule", key: btn.dataset.key });
      load();
    });
  });
}

document.getElementById("exportBtn").addEventListener("click", async () => {
  const resp = await chrome.runtime.sendMessage({ action: "exportRules" });
  const blob = new Blob([resp.json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "favicon-rules.json";
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("importFile").click();
});
document.getElementById("importFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  await chrome.runtime.sendMessage({ action: "importRules", json: text });
  load();
});

document.getElementById("deleteAllBtn").addEventListener("click", async () => {
  if (confirm("Supprimer toutes les règles ?")) {
    await chrome.runtime.sendMessage({ action: "deleteAllRules" });
    load();
  }
});

load();
</script>
</body>
</html>
